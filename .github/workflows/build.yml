name: Release Build

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: write

jobs:
  build-release:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          python3 - <<'PY'
          import os
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?",
              tag,
          )
          valid = match is not None
          if match is not None:
              prerelease, build = match.group(4), match.group(5)
              if prerelease is not None:
                  identifiers = prerelease.split(".")
                  valid = all(
                      identifier
                      and not (
                          identifier.isdigit()
                          and len(identifier) > 1
                          and identifier.startswith("0")
                      )
                      for identifier in identifiers
                  )
              if build is not None:
                  valid = valid and all(build.split("."))
          if not valid:
              print(f"Release tag is not strict SemVer: {tag}", file=sys.stderr)
              raise SystemExit(1)
          PY

          header_version="$(
            awk '
              /VERSION_MAJOR/ { major = $3 }
              /VERSION_MINOR/ { minor = $3 }
              /VERSION_PATCH/ { patch = $3 }
              END { print major "." minor "." patch }
            ' Inc/version.h
          )"
          tag_version="${tag#v}"
          tag_version="${tag_version%%[-+]*}"
          if [[ "$tag_version" != "$header_version" ]]; then
            echo "Tag $tag does not match Inc/version.h ($header_version)" >&2
            exit 1
          fi

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build Manafish firmware
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          make -j"$(nproc)" MANAFISH_RELEASE_VERSION="$release_version" product

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          shopt -s nullglob
          hex_firmware=(obj/AM32_SKYSTARS_AM60_V2_F421_*.hex)
          bin_firmware=(obj/AM32_SKYSTARS_AM60_V2_F421_*.bin)
          if (( ${#hex_firmware[@]} != 1 || ${#bin_firmware[@]} != 1 )); then
            echo "Expected one HEX and one BIN Manafish product firmware" >&2
            exit 1
          fi
          if [[ "$(stat -c '%s' "${bin_firmware[0]}")" != 27648 ]]; then
            echo "Raw application image must be exactly 27648 bytes" >&2
            exit 1
          fi
          cp -- "${hex_firmware[0]}" "${bin_firmware[0]}" release/
          hex_name="$(basename "${hex_firmware[0]}")"
          bin_name="$(basename "${bin_firmware[0]}")"
          (
            cd release
            sha256sum -- "$hex_name" > "$hex_name.sha256"
            sha256sum -- "$bin_name" > "$bin_name.sha256"
          )
          export RELEASE_BIN="release/$bin_name"
          export RELEASE_MANIFEST="release/${bin_name%.bin}.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          image_path = Path(os.environ["RELEASE_BIN"])
          image = image_path.read_bytes()
          release_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          expected_metadata = b"MANAESC1:" + release_version.encode("ascii") + b"\0"
          if expected_metadata not in image:
              raise SystemExit(
                  "Raw application image does not contain the exact release metadata"
              )
          if not image[-32:].startswith(b"SKYSTARS_AM60_V2_F421"):
              raise SystemExit("Raw application image has the wrong target metadata")
          manifest = {
              "applicationAddress": "0x08001000",
              "eepromAddress": "0x08007C00",
              "file": image_path.name,
              "sha256": hashlib.sha256(image).hexdigest(),
              "size": image_path.stat().st_size,
              "target": "SKYSTARS_AM60_V2_F421",
              "version": release_version,
          }
          Path(os.environ["RELEASE_MANIFEST"]).write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/*.hex
            release/*.bin
            release/*.json
            release/*.sha256
